<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Deletion Request | Madarsa Tus Salikat Lil Banat</title>
  <style>
    :root { color-scheme: light; --green:#0F5132; --gold:#D4AF37; --bg:#F7F6EF; --card:#FFFFFF; --text:#1F2937; --muted:#6B7280; --border:#E5E7EB; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    main { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: 0 12px 32px rgba(15, 81, 50, 0.12); }
    h1 { margin: 0 0 8px; color: var(--green); font-size: clamp(1.7rem, 5vw, 2.3rem); }
    .accent { width: 72px; height: 4px; border-radius: 999px; background: var(--gold); margin: 14px 0 20px; }
    p { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-weight: 700; margin: 16px 0 6px; color: var(--text); }
    input, textarea { width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; font: inherit; background: #fff; color: var(--text); }
    textarea { min-height: 140px; resize: vertical; }
    button { width: 100%; margin-top: 18px; border: 0; border-radius: 999px; padding: 14px 18px; background: var(--green); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .message { margin-top: 16px; padding: 12px 14px; border-radius: 14px; display: none; }
    .success { display: block; background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
    .error { display: block; background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
    .small { font-size: .9rem; }
    a { color: var(--green); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Account Deletion Request</h1>
      <div class="accent" aria-hidden="true"></div>
      <p>Use this form to request deletion of your Madarsa Tus Salikat Lil Banat app account. We may retain limited records where required for safety, legal, payment, dispute, or accounting obligations.</p>
      <form id="deletion-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />

        <label for="reason">Reason / request details</label>
        <textarea id="reason" name="reason" required minlength="8" maxlength="500" placeholder="Please describe your deletion request."></textarea>

        <button id="submit-btn" type="submit">Submit deletion request</button>
      </form>
      <div id="message" class="message" role="status"></div>
      <p class="small" style="margin-top:18px;">Privacy questions: madrastussalikatlilbanat@gmail.com</p>
      <p class="small"><a href="privacy-policy.html">Read our Privacy Policy</a></p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDFk_Cc6yEIROJ60vq0VtyFx0qd4YUeqxQ',
      authDomain: 'madrasa-app-50d6c.firebaseapp.com',
      projectId: 'madrasa-app-50d6c',
      storageBucket: 'madrasa-app-50d6c.appspot.com',
      messagingSenderId: '675123731963',
      appId: '1:675123731963:web:2b892063276a7c452cbf5e',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const form = document.getElementById('deletion-form');
    const button = document.getElementById('submit-btn');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.className = 'message';
      try {
        const email = document.getElementById('email').value.trim().toLowerCase();
        const reason = document.getElementById('reason').value.trim();
        if (!email || reason.length < 8) throw new Error('Please enter your email and at least 8 characters of request details.');
        const credential = await signInAnonymously(auth);
        const combinedReason = `Email: ${email}\nRequest: ${reason}`.slice(0, 600);
        await addDoc(collection(db, 'privacy_requests'), {
          user_id: credential.user.uid,
          type: 'deletion',
          reason: combinedReason,
          state: 'requested',
          lifecycle: [{ state: 'requested', at: new Date().toISOString(), source: 'public_account_deletion_page' }],
          created_at: serverTimestamp(),
          updated_at: serverTimestamp(),
        });
        form.reset();
        showMessage('Your account deletion request has been submitted for review.', 'success');
      } catch (error) {
        console.error(error);
        showMessage('Could not submit the request. Please try again or email madrastussalikatlilbanat@gmail.com.', 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
