name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, release/play-store-submission-v50 ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Create Production .env file
        working-directory: frontend
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_APP_ENV=production
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=madrasa-app-50d6c
          EXPO_PUBLIC_API_BASE_URL=https://msdl-backend.onrender.com/api
          EXPO_PUBLIC_LIVE_API_URL=https://msdl-backend.onrender.com
          EXPO_PUBLIC_PUSH_API_URL=https://msdl-backend.onrender.com
          EOF

      - name: Expo Prebuild (Generate Android native project)
        working-directory: frontend
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle Memory & ABI Settings for CI Runner
        working-directory: frontend/android
        run: |
          grep -v -E '^(org\.gradle\.jvmargs|org\.gradle\.parallel|org\.gradle\.workers\.max|reactNativeArchitectures)=' gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties
          {
            echo ""
            echo "# CI Runner stability tuning"
            echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
            echo "reactNativeArchitectures=arm64-v8a"
          } >> gradle.properties

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -x lint -x test -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSLB-Release-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
